aid: elation-health
name: Elation Health
review:
  question: >-
    Does Elation Health expose a real, documented public developer API, and is a
    machine-readable contract (OpenAPI and/or FHIR CapabilityStatement) harvestable?
  answer: true
  date: '2026-07-24'
  reviewer: API Evangelist
  homeMarket: United States
findings:
  summary: |
    Elation Health publishes a confirmed, live developer portal at
    https://docs.elationhealth.com/ (HTTP 200), a ReadMe-hosted site documenting the
    Elation API v2.0 - a broad REST API for clinical-first EHR data. The public REST
    surface is segmented by product (Patient Profile, Visit Notes, Patient Document,
    Orders, Scheduling, Billing, Insurance, [Premium] Patient Insurance & Eligibility,
    Practice, User Management, Messaging, Event Subscription/Webhooks, Reference Data,
    Care Gaps, Import, and OAuth). Eighteen machine-readable OpenAPI 3.x definitions
    back the ReadMe reference and were harvested verbatim from ReadMe's public
    api-registry endpoint (https://dash.readme.com/api/v1/api-registry/<uuid>); all 18
    parse as valid OpenAPI with schemas/paths. Production base URL (from the specs'
    servers) is https://api.app.elationemr.com/api/2.0 with a sandbox at
    https://sandbox.elationemr.com/api/2.0 (Care Gaps runs on a dedicated
    caregaps.sandbox.elationemr.com host). Authentication is OAuth2: the documented flow
    is client-credentials (with a legacy password grant) against
    /api/2.0/oauth2/token/, issuing bearer tokens. Token scopes (closed beta) follow
    apiv2 (full access, the default), act_as_user (provider impersonation via
    X-On-Behalf-Of), and system/{resource}.read | system/{resource}.write. Elation also
    documents an MCP server (https://docs.elationhealth.com/docs/mcp) for agentic access.
    Elation operates HL7 FHIR R4 / SMART-on-FHIR interoperability endpoints
    (e.g. /fhir/R4/metadata, /.well-known/smart-configuration) for ONC/CMS 21st Century
    Cures Act information-blocking compliance, but these are LOGIN-GATED: anonymous
    probes at sandbox.elationemr.com return the Okta login/SPA shell (HTTP 200 body =
    "Elation EMR (sandbox)" login page), not a public FHIR CapabilityStatement or
    SMART configuration JSON. No FHIR CapabilityStatement or smart-configuration was
    anonymously retrievable, so none was saved. Overall: self-documented REST API
    (partner/sandbox onboarding, not fully self-serve) with rich harvestable OpenAPI,
    plus a gated FHIR interoperability layer.
  developerPortal:
    url: https://docs.elationhealth.com/
    httpStatus: 200
    confirmed: true
    platform: ReadMe
  fhirCapabilityStatement:
    captured: false
    reason: >-
      FHIR R4 / SMART-on-FHIR endpoints exist for Cures Act compliance but are behind
      Okta login; /fhir/R4/metadata and /.well-known/smart-configuration on
      sandbox.elationemr.com return the authenticated app login shell, not a public
      CapabilityStatement or SMART configuration document.
    probes:
    - url: https://sandbox.elationemr.com/fhir/R4/metadata
      httpStatus: 200
      note: Returns Okta/SPA login HTML ("Elation EMR (sandbox)"), not a FHIR CapabilityStatement.
    - url: https://sandbox.elationemr.com/.well-known/smart-configuration
      httpStatus: 200
      note: Returns login shell HTML, not SMART configuration JSON.
    - url: https://sandbox.elationemr.com/api/2.0/.well-known/openid-configuration
      httpStatus: 200
      note: Returns login shell HTML, not an OpenID configuration document.
