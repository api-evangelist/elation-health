  authModel:
    scheme: OAuth2
    flows:
    - clientCredentials
    - password (legacy)
    tokenUrl: https://api.app.elationemr.com/api/2.0/oauth2/token/
    tokenType: bearer
    scopes:
    - apiv2 (full access to the API; default when no scope is requested)
    - act_as_user (impersonate a provider via X-On-Behalf-Of; combinable with apiv2 or system scopes)
    - system/{resource}.read
    - system/{resource}.write
    scopesStatus: closed beta
    smartOnFhir: >-
      SMART-on-FHIR / FHIR R4 endpoints exist for Cures Act interoperability but require
      registered-app + user authentication (Okta); not part of the anonymous public REST auth.
  standardsConformance:
    usCore: gated (FHIR R4 endpoints login-gated; ONC/CMS 21st Century Cures Act information-blocking compliance)
    ukCore: n/a
    auCore: n/a
    daVinci: not documented publicly
    carinBlueButton: not documented publicly
  accessPosture:
    gatedVsSelfServe: partner / sandbox onboarding (not fully self-serve)
    pricing: paid (contact/sales; sandbox available via request)
    sandbox: https://sandbox.elationemr.com/api/2.0
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://api.app.elationemr.com/api/2.0
    documented: true
  - protocol: REST
    scheme: https
    baseURL: https://sandbox.elationemr.com/api/2.0
    documented: true
    note: Sandbox environment.
  - protocol: Webhooks
    scheme: https
    documented: true
    note: Event Subscription API delivers near-real-time event notifications to subscriber callback URLs.
  - protocol: FHIR
    scheme: https
    documented: true
    note: HL7 FHIR R4 / SMART-on-FHIR interoperability endpoints exist for Cures Act compliance but are login-gated (not anonymously reachable).
  - protocol: WebSocket
    scheme: wss
    documented: false
    note: No WebSocket endpoint is documented in the Elation developer reference as of the review date.
