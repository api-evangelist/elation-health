docs: https://help.elationhealth.com/articles/rest/overview/scopes
docs_note: Re-harvested 2026-08-14 from the new documentation host. The scope reference now enumerates
  151 concrete system/<resource>.<permission> scopes across the Patient Profile, Patient Document, Orders,
  Messaging, Scheduling, Insurance, Billing, Practice, User Management and Reference Data APIs, replacing
  the system/{resource_name}.read|write placeholders recorded in the previous round. Format is system/<resource>.<permission>
  where permission is read (GET) or write (POST/PUT/PATCH/DELETE); nested endpoints inherit the parent
  resource scope; scopes are space-separated in the form-encoded scope parameter and CANNOT be combined
  with apiv2. Reference Data scopes are read-only by design. Practice admins can also assign scopes to
  credentials from the Elation UI (self-service API credential management).
