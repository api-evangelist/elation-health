  /api/2.0/billing_codes/:
    get:
      description: Get the CPT codes that the practice has set up. To view them in the app, go to Practice Settings - Billing.
      operationId: billing_codes_list
      parameters:
      - description: Multiple values may be separated by commas.
        explode: false
        in: query
        name: code
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Multiple values may be separated by commas.
        explode: false
        in: query
        name: description
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Number of results to return per page.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: The initial index from which to return the results.
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: Which field to use when ordering the results.
        in: query
        name: order_by
        required: false
        schema:
          type: string
      - description: Multiple values may be separated by commas.
        explode: false
        in: query
        name: practice
        schema:
          items:
            format: int64
            type: integer
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCPTCodeList'
          description: ''
      security:
      - oauth2: []
      summary: List Billing Codes
      tags:
      - Billing Codes
      x-el8-docs-category: Billing API
      x-el8-docs-versions:
      - '2.1'
      - '2.0'
    post:
      description: Create a CPT code that users can add to bills. To view them in the app, go to Practice Settings - Billing.
      operationId: billing_codes_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CPTCode'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CPTCode'
          description: ''
      security:
      - oauth2: []
      summary: Create Billing Code
      tags:
      - Billing Codes
      x-el8-docs-category: Billing API
      x-el8-docs-versions:
      - '2.1'
      - '2.0'
    servers:
    - description: Sandbox Server
      url: https://sandbox.elationemr.com
    - description: Production Server
      url: https://api.app.elationemr.com
