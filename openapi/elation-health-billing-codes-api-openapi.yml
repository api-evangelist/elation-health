components:
  schemas:
    PaginatedCPTCodeList:
      properties:
        count:
          example: 123
          type: integer
        next:
          example: http://api.example.org/accounts/?offset=400&limit=100
          format: uri
          nullable: true
          type: string
        previous:
          example: http://api.example.org/accounts/?offset=200&limit=100
          format: uri
          nullable: true
          type: string
        results:
          items:
            $ref: '#/components/schemas/CPTCode'
          type: array
      required:
      - results
      type: object
    CPTCode:
      properties:
        charge:
          description: The amount of money that will be charged for the code.
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type:
          - string
          - 'null'
        code:
          description: The code that a user and integrators will see.
          maxLength: 10
          type: string
        description:
          description: The description of the code that users will see.
          maxLength: 200
          type: string
        id:
          description: The internal elation id of the billing code.
          readOnly: true
          type: integer
        practice:
          description: The practice who created the billing code.
          format: int64
          type: integer
        sequence:
          description: The position in the list of billing codes.
          maximum: 2147483647
          minimum: -2147483648
          type: integer
      required:
      - code
      - description
      - practice
      type: object
    PatchedCPTCode:
      properties:
        charge:
          description: The amount of money that will be charged for the code.
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type:
          - string
          - 'null'
        code:
          description: The code that a user and integrators will see.
          maxLength: 10
          type: string
        description:
          description: The description of the code that users will see.
          maxLength: 200
          type: string
        id:
          description: The internal elation id of the billing code.
          readOnly: true
          type: integer
        practice:
          description: The practice who created the billing code.
          format: int64
          type: integer
        sequence:
          description: The position in the list of billing codes.
          maximum: 2147483647
          minimum: -2147483648
          type: integer
      type: object
  securitySchemes:
    sec0:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://example.com/oauth2/token
          scopes: {}
    oauth2:
      flows:
        clientCredentials:
          scopes:
            act_as_user: Impersonate a provider via X-On-Behalf-Of (combinable with apiv2 or system scopes)
            apiv2: Full access to the API
            system/{resource_name}.read: Read access to a specific resource
            system/{resource_name}.write: Write access to a specific resource
          tokenUrl: /api/2.0/oauth2/token/
      type: oauth2
