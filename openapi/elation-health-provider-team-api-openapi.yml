      x-el8-docs-versions:
      - '2.1'
      - '2.0'
    servers:
    - description: Sandbox Server
      url: https://sandbox.elationemr.com
    - description: Production Server
      url: https://api.app.elationemr.com
components:
  schemas:
    PatchedPatientProviderTeamMemberUpdate:
      properties:
        activity_summary_last_refreshed:
          description: The last known time when this team member's activity was synced.
          format: date-time
          readOnly: true
          type: string
        earliest_activity:
          description: Displays the earliest known interaction between the team member and the patient.
          format: date-time
          readOnly: true
          type: string
        group:
          allOf:
          - $ref: '#/components/schemas/GroupEnum'
          default: main
          description: 'Can either be `main` or `other`. By default members are placed in the `main` group. Only members in the `main` group will be displayed on the Patient chart in the web application.


            * `main` - main

            * `other` - other'
        latest_activity:
          description: Displays the latest known interaction between the team member and the patient.
          format: date-time
          readOnly: true
          type: string
        patient_id:
          description: The id of the Patient that this team is associated with.
          readOnly: true
          type: integer
        patient_provider_team_id:
          description: Patient Provider team ID
          readOnly: true
          type: integer
        patient_provider_team_member_id:
          readOnly: true
          type: integer
        physician_id:
          description: The Physician that this team member represents.
          readOnly: true
          type: integer
        rank:
          description: Used for displaying a sorted patient provider team in the patient chart. Rank is sequential and begins at 1.
          minimum: 1
          readOnly: true
          type: integer
        treatment_reason:
          description: The reason why this physician is in this team
          type:
          - string
          - 'null'
      type: object
    PatientProviderTeamMemberUpdate:
      properties:
        activity_summary_last_refreshed:
          description: The last known time when this team member's activity was synced.
          format: date-time
          readOnly: true
          type: string
        earliest_activity:
          description: Displays the earliest known interaction between the team member and the patient.
          format: date-time
          readOnly: true
          type: string
        group:
          allOf:
          - $ref: '#/components/schemas/GroupEnum'
          default: main
          description: 'Can either be `main` or `other`. By default members are placed in the `main` group. Only members in the `main` group will be displayed on the Patient chart in the web application.


            * `main` - main

            * `other` - other'
        latest_activity:
          description: Displays the latest known interaction between the team member and the patient.
          format: date-time
          readOnly: true
          type: string
        patient_id:
          description: The id of the Patient that this team is associated with.
          readOnly: true
          type: integer
        patient_provider_team_id:
          description: Patient Provider team ID
          readOnly: true
          type: integer
        patient_provider_team_member_id:
          readOnly: true
          type: integer
        physician_id:
          description: The Physician that this team member represents.
          readOnly: true
          type: integer
        rank:
          description: Used for displaying a sorted patient provider team in the patient chart. Rank is sequential and begins at 1.
          minimum: 1
          readOnly: true
          type: integer
        treatment_reason:
          description: The reason why this physician is in this team
          type:
          - string
          - 'null'
      type: object
    PaginatedPatientProviderTeamList:
      properties:
        count:
          example: 123
          type: integer
        next:
          example: http://api.example.org/accounts/?offset=400&limit=100
          format: uri
          nullable: true
          type: string
        previous:
          example: http://api.example.org/accounts/?offset=200&limit=100
          format: uri
          nullable: true
          type: string
        results:
          items:
            $ref: '#/components/schemas/PatientProviderTeam'
          type: array
      required:
      - results
      type: object
    PatientProviderTeamMember:
      properties:
        activity_summary_last_refreshed:
          description: The last known time when this team member's activity was synced.
          format: date-time
          readOnly: true
          type: string
        earliest_activity:
          description: Displays the earliest known interaction between the team member and the patient.
          format: date-time
          readOnly: true
          type: string
        group:
          allOf:
          - $ref: '#/components/schemas/GroupEnum'
          default: main
          description: 'Can either be `main` or `other`. By default members are placed in the `main` group. Only members in the `main` group will be displayed on the Patient chart in the web application.


            * `main` - main

            * `other` - other'
        latest_activity:
          description: Displays the latest known interaction between the team member and the patient.
          format: date-time
          readOnly: true
          type: string
        patient_id:
          description: The id of the Patient that this team is associated with.
          readOnly: true
          type: integer
        patient_provider_team_id:
          description: Patient Provider team ID
          type: integer
        patient_provider_team_member_id:
          readOnly: true
          type: integer
        physician_id:
          description: The Physician that this team member represents.
          type: integer
        rank:
          description: Used for displaying a sorted patient provider team in the patient chart. Rank is sequential and begins at 1.
          minimum: 1
          readOnly: true
          type: integer
        treatment_reason:
          description: The reason why this physician is in this team
          type:
          - string
          - 'null'
      required:
      - patient_provider_team_id
      - physician_id
      type: object
    GroupEnum:
      description: '* `main` - main

        * `other` - other'
      enum:
      - main
      - other
      type: string
    PatientProviderTeam:
      properties:
        patient_id:
          description: The id of the Patient object that this team is associated with.
          readOnly: true
          type: integer
        patient_provider_team_id:
          type: integer
        team_members:
          description: The list of providers that are providing care to the above patient.
          items:
            $ref: '#/components/schemas/PatientProviderTeamMember'
          readOnly: true
          type: array
      required:
      - patient_provider_team_id
      type: object
  securitySchemes:
    oauth2:
      flows:
        clientCredentials:
          scopes:
            act_as_user: Impersonate a provider via X-On-Behalf-Of (combinable with apiv2 or system scopes)
            apiv2: Full access to the API
            system/{resource_name}.read: Read access to a specific resource
            system/{resource_name}.write: Write access to a specific resource
          tokenUrl: /api/2.0/oauth2/token/
      type: oauth2
