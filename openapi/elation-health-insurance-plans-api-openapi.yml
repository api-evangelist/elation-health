          - 'null'
        id:
          readOnly: true
          type: integer
        insurance_company:
          description: The insurance company that the plan is associated with.
          format: int64
          type: integer
        name:
          maxLength: 200
          type: string
        patients:
          items:
            type: integer
          readOnly: true
          type: array
        practice:
          format: int64
          type: integer
      type: object
    InsurancePlanSingleInstance:
      properties:
        created_date:
