components:
  schemas:
    InsurancePlan:
      properties:
        created_date:
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        deleted_date:
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        id:
          readOnly: true
          type: integer
        insurance_company:
          description: The insurance company that the plan is associated with.
          format: int64
          type: integer
        name:
          maxLength: 200
          type: string
        practice:
          format: int64
          type: integer
      required:
      - insurance_company
      - name
      - practice
      type: object
    PaginatedInsurancePlanList:
      properties:
        count:
          example: 123
          type: integer
        next:
          example: http://api.example.org/accounts/?offset=400&limit=100
          format: uri
          nullable: true
          type: string
        previous:
          example: http://api.example.org/accounts/?offset=200&limit=100
          format: uri
          nullable: true
          type: string
        results:
          items:
            $ref: '#/components/schemas/InsurancePlan'
          type: array
      required:
      - results
      type: object
    PatchedInsurancePlanSingleInstance:
      properties:
        created_date:
          format: date-time
