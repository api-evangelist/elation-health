openapi: 3.2.0
info:
  title: Elation Health Physicians API
  version: '1.0'
  description: 'Operations tagged Physicians across 3 of this provider''s published API definitions: elation-api-settings.json, elation-health-api-full-openapi.yaml, elation-health-elation-health-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sandbox.elationemr.com/api/2.0
- description: Sandbox Server
  url: https://sandbox.elationemr.com
- description: Production Server
  url: https://api.app.elationemr.com
- url: https://app.elationemr.com/api/2.0
  description: Production
tags:
- name: Physicians
paths:
  /physicians/:
    get:
      summary: Find Physicians
      description: ''
      operationId: find-physicians
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: first_name
        in: query
        schema:
          type: string
      - name: last_name
        in: query
        schema:
          type: string
      - name: npi
        in: query
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "import requests\nimport json\n\naccess_token = \"VFroUHsmrErlVI6nJ08Alwhri5RGCW\"\nauth_header = \"Bearer %s\" % (access_token)\n\nresp = requests.get(\"https://sandbox.elationemr.com/api/2.0/physicians/\",\n                    headers={'Authorization': auth_header})\n\nprint resp.status_code\nprint json.dumps(json.loads(resp.content), indent=2)"
        samples-languages:
        - python
      tags:
      - Physicians
      security:
      - sec0: []
    servers:
    - url: https://sandbox.elationemr.com/api/2.0
  /physicians/{id}/:
    get:
      summary: Get Physician
      description: ''
      operationId: get-physician
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the physician ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  // see Physician object\n}"
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "import requests\nimport json\n\naccess_token = \"VFroUHsmrErlVI6nJ08Alwhri5RGCW\"\nauth_header = \"Bearer %s\" % (access_token)\n\nresp = requests.get(\"https://sandbox.elationemr.com/api/2.0/physicians/123/\",\n                    headers={'Authorization': auth_header})\n\nprint resp.status_code\nprint json.dumps(json.loads(resp.content), indent=2)"
        samples-languages:
        - python
      tags:
      - Physicians
      security:
      - sec0: []
    put:
      summary: Update Physician
      description: ''
      operationId: update-physician-wip
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the physician ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - first_name
              - last_name
              - email
              properties:
                first_name:
                  type: string
                  description: 'Maximum length: 50 characters.'
                last_name:
                  type: string
                  description: 'Maximum length: 60 characters.'
                email:
                  type: string
                metadata:
                  type: object
                  description: nullable. See Metadata section
                  properties:
                    object_id:
                      type: integer
                      description: for updating object must provide 'object_id' or 'data'
                      format: int32
                    data:
                      type: string
                      description: for updating object must provide 'object_id' or 'data'
                    object_web_link:
                      type: string
                      description: for updating object must provide 'object_id' or 'data'
                npi:
                  type: string
                license:
                  type: string
                license_state:
                  type: string
                credentials:
                  type: string
                telehealth_settings:
                  type: object
                  description: The telehealth settings for the physician
                  properties:
                    default_telehealth_instructions:
                      type: string
                      description: The default instructions populated for telehealth appointments
                    zoom_join_url:
                      type: string
                      description: If the provider is set up with Zoom® integration, then this is their personal meeting url
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": 140758834544642,\n    \"first_name\": \"Christopher\",\n    \"last_name\": \"Morales\",\n    \"credentials\": \"cred\",\n    \"is_active\": true,\n    \"email\": \"betle+Riley._Love_and_Chavez@elationhealth.com\",\n    \"npi\": \"155532\",\n    \"license\": \"20977\",\n    \"license_state\": \"YY\",\n    \"specialty\": null,\n    \"user_id\": 64,\n    \"practice\": 140758831005700,\n    \"metadata\": {\n        \"object_id\": \"1234\",\n        \"data\": \"text\",\n        \"object_web_link\": \"link\"\n    }\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 140758834544642
                    default: 0
                  first_name:
                    type: string
                    example: Christopher
                  last_name:
                    type: string
                    example: Morales
                  credentials:
                    type: string
                    example: cred
                  is_active:
                    type: boolean
                    example: true
                    default: true
                  email:
                    type: string
                    example: betle+Riley._Love_and_Chavez@elationhealth.com
                  npi:
                    type: string
                    example: '155532'
                  license:
                    type: string
                    example: '20977'
                  license_state:
                    type: string
                    example: YY
                  specialty: {}
                  user_id:
                    type: integer
                    example: 64
                    default: 0
                  practice:
                    type: integer
                    example: 140758831005700
                    default: 0
                  metadata:
                    type: object
                    properties:
                      object_id:
                        type: string
                        example: '1234'
                      data:
                        type: string
                        example: text
                      object_web_link:
                        type: string
                        example: link
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "import requests\nimport json\n\naccess_token = \"VFroUHsmrErlVI6nJ08Alwhri5RGCW\"\nauth_header = \"Bearer %s\" % (access_token)\n\ndata = {\n    \"first_name\": \"Christopher\",\n    \"last_name\": \"Morales\",\n    \"credentials\": \"cred\",\n    \"email\": \"betle+Riley._Love_and_Chavez@elationhealth.com\",\n    \"npi\": \"155532\",\n    \"license\": \"20977\",\n    \"license_state\": \"YY\",\n    \"metadata\": {\n        \"object_id\": 1234, \n        \"data\": \"text\",\n        \"object_web_link\": \"link\"\n    }\n}\n\nresp = requests.put(\"https://sandbox.elationemr.com/api/2.0/physicians/123/\",\n                    json=data,\n                    headers={'Authorization': auth_header})\n\nprint resp.status_code\nprint json.dumps(json.loads(resp.content), indent=2)"
        samples-languages:
        - python
      tags:
      - Physicians
      security:
      - sec0: []
    patch:
      summary: Update Physician
      description: ''
      operationId: update-physician-wip-1
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the physician ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: 'The physicians first name. Maximum length: 50 characters.'
                last_name:
                  type: string
                  description: 'The physicians last name. Maximum length: 60 characters.'
                email:
                  type: string
                  description: The physicians email. Usually used for login.
                metadata:
                  type: object
                  description: nullable. See Metadata section
                  properties:
                    object_id:
                      type: integer
                      description: for updating object must provide 'object_id' or 'data'
                      format: int32
                    data:
                      type: string
                      description: for updating object must provide 'object_id' or 'data'
                    object_web_link:
                      type: string
                      description: for updating object must provide 'object_id' or 'data'
                npi:
                  type: string
                license:
                  type: string
                license_state:
                  type: string
                credentials:
                  type: string
                telehealth_settings:
                  type: object
                  description: The telehealth settings for the physician
                  properties:
                    default_telehealth_instructions:
                      type: string
                      description: The default instructions populated for telehealth appointments
                    zoom_join_url:
                      type: string
                      description: If the provider is set up with Zoom® integration, then this is their personal meeting url
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": 140758834544642,\n    \"first_name\": \"Christopher\",\n    \"last_name\": \"Morales\",\n    \"credentials\": \"cred\",\n    \"is_active\": true,\n    \"email\": \"betle+Riley._Love_and_Chavez@elationhealth.com\",\n    \"npi\": \"155532\",\n    \"license\": \"20977\",\n    \"license_state\": \"YY\",\n    \"specialty\": null,\n    \"user_id\": 64,\n    \"practice\": 140758831005700,\n    \"metadata\": {\n        \"object_id\": \"1234\",\n        \"data\": \"text\",\n        \"object_web_link\": \"link\"\n    }\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 140758834544642
                    default: 0
                  first_name:
                    type: string
                    example: Christopher
                  last_name:
                    type: string
                    example: Morales
                  credentials:
                    type: string
                    example: cred
                  is_active:
                    type: boolean
                    example: true
                    default: true
                  email:
                    type: string
                    example: betle+Riley._Love_and_Chavez@elationhealth.com
                  npi:
                    type: string
                    example: '155532'
                  license:
                    type: string
                    example: '20977'
                  license_state:
                    type: string
                    example: YY
                  specialty: {}
                  user_id:
                    type: integer
                    example: 64
                    default: 0
                  practice:
                    type: integer
                    example: 140758831005700
                    default: 0
                  metadata:
                    type: object
                    properties:
                      object_id:
                        type: string
                        example: '1234'
                      data:
                        type: string
                        example: text
                      object_web_link:
                        type: string
                        example: link
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "import requests\nimport json\n\naccess_token = \"VFroUHsmrErlVI6nJ08Alwhri5RGCW\"\nauth_header = \"Bearer %s\" % (access_token)\n\ndata = {\n    \"first_name\": \"Christopher\",\n    \"last_name\": \"Morales\",\n    \"credentials\": \"cred\",\n    \"email\": \"betle+Riley._Love_and_Chavez@elationhealth.com\",\n    \"npi\": \"155532\",\n    \"license\": \"20977\",\n    \"license_state\": \"YY\",\n    \"metadata\": {\n        \"object_id\": 1234, \n        \"data\": \"text\",\n        \"object_web_link\": \"link\"\n    }\n}\n\nresp = requests.patch(\"https://sandbox.elationemr.com/api/2.0/physicians/123/\",\n                    json=data,\n                    headers={'Authorization': auth_header})\n\nprint resp.status_code\nprint json.dumps(json.loads(resp.content), indent=2)"
        samples-languages:
        - python
      tags:
      - Physicians
      security:
      - sec0: []
    servers:
    - url: https://sandbox.elationemr.com/api/2.0
  /physicians/{id}/availabilities:
    put:
      summary: Update Physician Availabilities
      description: ''
      operationId: update-physician-availabilities
      responses:
        '200':
          description: '200'
          content:
            application/json:
