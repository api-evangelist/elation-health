openapi: 3.2.0
info:
  title: Elation Health Drug Intolerances API
  version: '1.0'
  description: 'Operations tagged Drug Intolerances across 3 of this provider''s published API definitions: elation-api-settings.json, elation-health-api-full-openapi.yaml, elation-patient-profile-api.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sandbox.elationemr.com/api/2.0
- description: Sandbox Server
  url: https://sandbox.elationemr.com
- description: Production Server
  url: https://api.app.elationemr.com
tags:
- name: Drug Intolerances
paths:
  /drug_intolerances/:
    get:
      summary: Find Drug Intolerances
      description: ''
      operationId: find-drug-intolerances
      parameters:
      - name: patients
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"count\": 123,\n  \"next\": \"https://sandbox.elationemr.com/api/2.0/drug_intolerances/?limit=10&offset=10\",\n  \"previous\": \"https://sandbox.elationemr.com/api/2.0/drug_intolerances/?limit=10\",\n  \"results\": [  // list of objects\n    { // See Object Definition },\n    // ...\n    { // See Object Definition },\n  ]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
