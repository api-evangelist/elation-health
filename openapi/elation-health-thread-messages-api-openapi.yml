openapi: 3.2.0
info:
  title: Elation Health Thread Messages API
  version: '1.0'
  description: 'Operations tagged Thread Messages across 3 of this provider''s published API definitions: elation-api-settings.json, elation-health-api-full-openapi.yaml, elation-messaging-api.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sandbox.elationemr.com/api/2.0
- description: Sandbox Server
  url: https://sandbox.elationemr.com
- description: Production Server
  url: https://api.app.elationemr.com
tags:
- name: Thread Messages
paths:
  /thread_messages/{id}:
    get:
      summary: Get Thread Message
      description: ''
      operationId: get-thread-message
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 83792571234,\n  // See Object Definition\n}"
        '303':
          description: '303'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "import requests\nimport json\n\naccess_token = \"TyEPKw8fVGRKpCBa81ygwjCLXDNIAm\"\nauth_header = \"Bearer %s\" % (access_token)\n\nresp = requests.get(\"https://sandbox.elationemr.com/api/2.0/thread_messages/83792571234/\",\n                    headers={'Authorization': auth_header})\n\nprint resp.status_code\nprint json.dumps(json.loads(resp.content), indent=2)"
        - language: curl
          code: 'curl https://sandbox.elationemr.com/api/2.0/patients/64184451073/ \

            > -H "Authorization: Bearer XaTtPYZ8Ufy04f0187fPbWFkwcADF0"'
          name: cURL
        samples-languages:
        - python
        - curl
      tags:
      - Thread Messages
      security:
      - sec0: []
    delete:
      summary: Delete Thread Message
      description: ''
      operationId: delete-thread-message
      parameters:
      - name: id
        in: path
        description: The id of the thread message.
        schema:
          type: integer
          format: int32
        required: true
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Thread Messages
      security:
      - sec0: []
    servers:
    - url: https://sandbox.elationemr.com/api/2.0
  /thread_messages/:
    get:
      summary: Find Thread Messages
      description: ''
      operationId: find-thread-messages
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"count\": 123,\n  \"next\": \"https://sandbox.elationemr.com/api/2.0/thread_messages/?limit=10&offset=10\",\n  \"previous\": \"https://sandbox.elationemr.com/api/2.0/thread_messages/?limit=10\",\n  \"results\": [  // list of objects\n    { // See Object Definition },\n    // ...\n    { // See Object Definition },\n  ]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "import requests\nimport json\n\naccess_token = \"VFroUHsmrErlVI6nJ08Alwhri5RGCW\"\nauth_header = \"Bearer %s\" % (access_token)\n\nresp = requests.get(\"https://sandbox.elationemr.com/api/2.0/thread_messages/\",\n                    headers={'Authorization': auth_header})\n\nprint resp.status_code\nprint json.dumps(json.loads(resp.content), indent=2)"
        samples-languages:
        - python
      tags:
      - Thread Messages
      security:
      - sec0: []
    post:
      summary: Create Thread Message
      description: ''
      operationId: create-thread-message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - thread
              - sender
              - body
              - send_date
              properties:
                thread:
                  type: integer
                  description: The message thread we're replying to
                  format: int32
                sender:
                  type: integer
                  description: The user id of the sender
                  format: int32
                body:
                  type: string
                  description: The message
                send_date:
                  type: string
                  description: The timestamp of when this message was sent
                  format: date
                to_document:
                  type: object
                  description: A document this message is in reference to
                  properties: {}
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Thread Messages
      security:
      - sec0: []
    servers:
    - url: https://sandbox.elationemr.com/api/2.0
