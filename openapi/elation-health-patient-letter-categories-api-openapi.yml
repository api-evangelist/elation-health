openapi: 3.2.0
info:
  contact:
    name: Elation Health
    url: https://www.elationhealth.com/
  description: Elation Health API v2.0
  title: Elation Health Patient Letter Categories API
  version: 2.0.0
servers:
- description: Sandbox Server
  url: https://sandbox.elationemr.com
- description: Production Server
  url: https://api.app.elationemr.com
tags:
- name: Patient Letter Categories
paths:
  /api/2.0/patient_letter_categories/:
    get:
      description: Returns a list of patient letter categories
      operationId: patient_letter_categories_list
      parameters:
      - description: Number of results to return per page.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: The initial index from which to return the results.
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: Which field to use when ordering the results.
        in: query
        name: order_by
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLetterCategoryList'
          description: ''
      security:
      - oauth2: []
      summary: List Patient Letter Categories
      tags:
      - Patient Letter Categories
      x-el8-docs-category: Patient Document API
      x-el8-docs-versions:
      - '2.1'
      - '2.0'
  /api/2.0/patient_letter_categories/{id}/:
    get:
      description: Retrieve a single patient letter category
      operationId: patient_letter_categories_retrieve
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterCategory'
          description: ''
      security:
      - oauth2: []
      summary: Retrieve Patient Letter Category
      tags:
      - Patient Letter Categories
      x-el8-docs-category: Patient Document API
      x-el8-docs-versions:
      - '2.1'
      - '2.0'
components:
  schemas:
    LetterCategory:
      properties:
        id:
          format: int64
          type: integer
        key:
          maxLength: 25
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        text:
          maxLength: 100
          type: string
      required:
      - id
      - key
      - text
      type: object
    PaginatedLetterCategoryList:
      properties:
        count:
          example: 123
          type: integer
        next:
          example: http://api.example.org/accounts/?offset=400&limit=100
          format: uri
          nullable: true
          type: string
        previous:
          example: http://api.example.org/accounts/?offset=200&limit=100
          format: uri
          nullable: true
          type: string
        results:
          items:
            $ref: '#/components/schemas/LetterCategory'
          type: array
      required:
      - results
      type: object
    RoleEnum:
      enum:
      - Primary Provider
      - Staff
      type: string
  securitySchemes:
    oauth2:
      flows:
        clientCredentials:
          scopes:
            act_as_user: Impersonate a provider via X-On-Behalf-Of (combinable with apiv2 or system scopes)
            apiv2: Full access to the API
            system/{resource_name}.read: Read access to a specific resource
            system/{resource_name}.write: Write access to a specific resource
          tokenUrl: /api/2.0/oauth2/token/
      type: oauth2
x-readme:
  proxy-enabled: true
