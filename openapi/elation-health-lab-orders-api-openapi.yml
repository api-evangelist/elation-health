    post:
      summary: Create Lab Order
      description: ''
      operationId: create-lab-order
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - document_date
              - ordering_physician
              - patient
              - practice
              properties:
                answers:
                  type: array
                  description: Value must be Lab for laboratory reports
                  items:
                    properties:
                      test:
                        type: integer
                        format: int32
                      question:
                        type: integer
                        format: int32
                      value:
                        type: string
                    required:
                    - test
                    - question
                    - value
                    type: object
                bill_type:
                  type: string
                  enum:
                  - ("thirdparty"
