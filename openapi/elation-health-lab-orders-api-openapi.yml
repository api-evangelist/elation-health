                      - wet_reading_phone
                      - wet_reading_fax
                      - stat_phone
                      - stat_fax
                      - stat_phone_fax
                    patient_instructions:
                      type: string
                    test_center_notes:
                      type: string
                    fasting_method:
                      type: string
