                      - fasting_12_hour
                      - fasting_8_hours
                      - fasting_2_hours
                      - fasting_none
                      - fasting_random
                    standing_order_frequency:
                      type: string
                    standing_order_end_date:
                      type: string
                      format: date
                    collection_datetime:
                      type: string
                      format: date
                    icd10_codes:
                      type: array
                      items:
                        properties:
