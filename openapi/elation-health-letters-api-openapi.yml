    get:
      summary: Find Letters
      description: ''
      operationId: find-letters
      parameters:
      - name: patient
        in: query
        description: Patient ID
        schema:
          type: integer
          format: int32
      - name: practice
        in: query
        description: Practice ID
        schema:
          type: integer
          format: int32
      - name: document_date__gt
        in: query
        schema:
          type: string
          format: date
      - name: document_date__lt
        in: query
        schema:
          type: string
          format: date
      - name: document_date__gte
        in: query
        schema:
          type: string
          format: date
      - name: document_date__lte
        in: query
        schema:
          type: string
          format: date
      - name: recipient_name
        in: query
        description: Recipient Name
        schema:
          type: string
      - name: recipient_id
        in: query
        description: Recipient ID
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
