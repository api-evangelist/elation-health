                        created_date:
                          type: string
                          example: '2022-05-24T19:51:46Z'
                        deleted_date: {}
                        document_date:
                          type: string
                          example: '2022-05-24T19:51:46Z'
                        fulfillment: {}
                        is_doc_med:
                          type: boolean
                          example: false
                          default: true
                        last_modified:
                          type: string
                          example: '2022-05-24T19:51:46Z'
                        medication:
                          type: object
