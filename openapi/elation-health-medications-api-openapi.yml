openapi: 3.2.0
info:
  title: Elation Health Medications API
  version: '1.0'
  description: 'Operations tagged Medications across 3 of this provider''s published API definitions: elation-api-settings.json, elation-health-api-full-openapi.yaml, elation-health-elation-health-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sandbox.elationemr.com/api/2.0
- description: Sandbox Server
  url: https://sandbox.elationemr.com
- description: Production Server
  url: https://api.app.elationemr.com
- url: https://app.elationemr.com/api/2.0
  description: Production
tags:
- name: Medications
paths:
  /medications/:
    get:
      summary: Find Medications
      description: ''
      operationId: find-medications
      parameters:
      - name: patient
        in: query
        schema:
          type: integer
          format: int32
      - name: thread
        in: query
        schema:
          type: integer
          format: int32
      - name: practice
        in: query
        schema:
          type: integer
          format: int32
      - name: discontinued
        in: query
        description: Whether the thread has a discontinue order or not
        schema:
          type: boolean
      - name: permanent
        in: query
        description: Whether the medication is temporary or permanent.
        schema:
          type: boolean
      - name: document_date__lt
        in: query
        description: Date/time in ISO 8601 UTC format that selects chart dates that precede it (exclusive)
        schema:
          type: string
      - name: document_date__gt
        in: query
        description: Date/time in ISO 8601 UTC format that selects chart dates that follow it (exclusive)
        schema:
          type: string
      - name: document_date__lte
        in: query
        description: Date/time in ISO 8601 UTC format that selects chart dates that equal or precede it (inclusive)
        schema:
          type: string
      - name: document_date__gte
        in: query
        description: Date/time in ISO 8601 UTC format that selects chart dates that equal or follow it (inclusive)
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
