  /patients/:
    post:
      summary: Create Patient
      description: ''
      operationId: create-patient
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - first_name
              - last_name
              - dob
              - sex
              - primary_physician
              - caregiver_practice
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                dob:
                  type: string
                  format: date
                sex:
                  type: string
                  description: Male, Female, or Unknown (displays as Unspecified in app)
                primary_physician:
                  type: integer
                  description: The primary physician assigned to this physician within the practice
                  format: int32
                caregiver_practice:
                  type: integer
                  format: int32
                address:
                  type: object
                  required:
                  - address_line1
                  properties:
                    address_line1:
                      type: string
                    address_line2:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    zip:
                      type: string
                phones:
                  type: array
                  items:
                    properties:
                      phone:
                        type: string
                        description: String or Integer
                      phone_type:
                        type: string
                    required:
                    - phone
                    - phone_type
                    type: object
                emails:
                  type: array
                  items:
                    properties:
                      email:
                        type: string
                    required:
                    - email
                    type: object
                insurances:
                  type: array
                  items:
                    properties:
                      member_id:
                        type: string
                    required:
                    - member_id
                    type: object
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 67176497153, \n  // See Object Definition\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"field_name\": [\"error message\"]\n}\n\n// for example: (if caregiver_practice was not provided)\n{\n  \"caregiver_practice\": [\"This field is required.\"]\n}"
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "import requests\nimport json\n\naccess_token = \"TyEPKw8fVGRKpCBa81ygwjCLXDNIAm\"\nauth_header = \"Bearer %s\" % (access_token)\n\nnew_patient = {\n  \"first_name\": \"test\",\n  \"last_name\": \"patient\",\n  \"sex\": \"Male\",\n  \"dob\": \"1955-01-01\",\n  \"primary_physician\": 131074,\n  \"caregiver_practice\": 65540\n}\n\nresp = requests.post(\"https://sandbox.elationemr.com/api/2.0/patients/\",\n                     data=json.dumps(new_patient),\n                     headers={'Authorization': auth_header,\n                              'Content-type': 'application/json'})\n\nprint resp.status_code\nprint json.dumps(json.loads(resp.content), indent=2)"
        samples-languages:
        - python
