components:
  schemas:
    PronounsDisplayEnum:
      enum:
      - He/Him/His
      - Option not listed
      - She/Her/Hers
      - They/Them/Theirs
      - None
      type: string
    EthnicityEnum:
      enum:
      - Declined to specify
      - Hispanic or Latino
      - No ethnicity specified
      - Not Hispanic or Latino
      type: string
    GenderIdentityEnum:
      enum:
      - man
      - nonbinary
      - option_not_listed
      - prefer_not_to_say
      - transgender_man
      - transgender_woman
      - two_spirit
      - unknown
      - woman
      type: string
    Employer:
      properties:
        code:
          maxLength: 50
          type: string
        description:
          readOnly: true
          type:
          - string
          - 'null'
        name:
          readOnly: true
          type:
          - string
          - 'null'
      required:
      - code
      type: object
    Patient:
      properties:
        actual_name:
          maxLength: 150
          type:
          - string
          - 'null'
        address:
          oneOf:
          - $ref: '#/components/schemas/Address'
          - type: 'null'
        caregiver_practice:
          format: int64
          type: integer
        consents:
          items:
            $ref: '#/components/schemas/Consent'
          type: array
        created_date:
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        deleted_date:
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        deleted_insurances:
          items:
            $ref: '#/components/schemas/Insurance'
          readOnly: true
          type: array
        dob:
          format: date
          type: string
        emails:
          items:
            $ref: '#/components/schemas/Email'
          type:
          - array
          - 'null'
        emergency_contact:
          oneOf:
          - $ref: '#/components/schemas/EmergencyContact'
          - type: 'null'
        employer:
          oneOf:
          - $ref: '#/components/schemas/Employer'
          - type: 'null'
        ethnicity:
          $ref: '#/components/schemas/EthnicityEnum'
        first_name:
          maxLength: 70
          type: string
        gender_identity:
          $ref: '#/components/schemas/GenderIdentityEnum'
        guarantor:
          oneOf:
          - $ref: '#/components/schemas/Guarantor'
          - type: 'null'
        id:
          readOnly: true
          type: integer
        insurances:
          items:
            $ref: '#/components/schemas/Insurance'
          type: array
        last_modified:
          format: date-time
          type: string
        last_name:
          maxLength: 70
          type: string
        legal_gender_marker:
          oneOf:
          - $ref: '#/components/schemas/LegalGenderMarkerEnum'
          - $ref: '#/components/schemas/NullEnum'
        legal_gender_marker_display:
          oneOf:
          - $ref: '#/components/schemas/LegalGenderMarkerDisplayEnum'
          - $ref: '#/components/schemas/NullEnum'
        master_patient:
          format: int64
          readOnly: true
          type: integer
        merged_into_chart:
          readOnly: true
          type:
          - integer
          - 'null'
        metadata:
          properties:
            data:
              type: object
            object_id:
              type: string
            object_web_link:
              type: string
          type:
          - object
          - 'null'
        middle_name:
          maxLength: 50
          type: string
        mothers_maiden_name:
          maxLength: 70
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
        occupation:
          maxLength: 100
          readOnly: true
          type:
          - string
          - 'null'
        patient_status:
          oneOf:
          - $ref: '#/components/schemas/Status'
          - type: 'null'
        phones:
          items:
            $ref: '#/components/schemas/Phone'
          type: array
        preference:
          oneOf:
          - $ref: '#/components/schemas/PatientPreference'
          - type: 'null'
        preferred_contact:
          oneOf:
          - $ref: '#/components/schemas/PreferredContactEnum'
          - $ref: '#/components/schemas/NullEnum'
        preferred_language:
          type:
          - string
          - 'null'
        preferred_service_location:
          format: int64
          type:
          - integer
          - 'null'
        previous_address:
          oneOf:
          - $ref: '#/components/schemas/Address'
          - type: 'null'
        previous_first_name:
          maxLength: 70
          type:
          - string
          - 'null'
        previous_last_name:
          maxLength: 70
          type:
          - string
          - 'null'
        previous_name:
          oneOf:
          - $ref: '#/components/schemas/PatientPreviousName'
          - type: 'null'
        primary_care_provider:
          description: A read-only field that provides the internal Elation id of the collaborator record that is created within your practice to represent your practice's connection with the patient's primary care provider.
          format: int64
          readOnly: true
          type: integer
        primary_care_provider_npi:
          description: Represents the patient's primary care provider. This person may be in a different practice.
          maxLength: 10
          type:
          - string
          - 'null'
        primary_physician:
          description: Represents the physician providing care to the patient within your practice. This is a required field. This value must match the id of one of the physicians retrieved via the /physicians/ endpoint.
          format: int64
          type: integer
        pronouns:
          oneOf:
          - $ref: '#/components/schemas/PronounsEnum'
          - $ref: '#/components/schemas/NullEnum'
        pronouns_display:
          oneOf:
          - $ref: '#/components/schemas/PronounsDisplayEnum'
          - $ref: '#/components/schemas/NullEnum'
        race:
          $ref: '#/components/schemas/RaceEnum'
        sex:
          allOf:
          - $ref: '#/components/schemas/PatientSexEnum'
          default: Unknown
        sexual_orientation:
          $ref: '#/components/schemas/SexualOrientationEnum'
        sms_opt_in_status:
          type:
          - boolean
          - 'null'
        ssn:
          maxLength: 37
          type:
          - string
          - 'null'
        suffix:
          maxLength: 20
          type: string
        tags:
          items: {}
          type:
          - array
          - 'null'
        timezone:
          oneOf:
          - $ref: '#/components/schemas/TimezoneEnum'
          - $ref: '#/components/schemas/NullEnum'
        verified:
          default: true
          type: boolean
        vip:
          type:
          - boolean
          - 'null'
      required:
      - caregiver_practice
      - dob
      - first_name
      - last_name
      - primary_physician
      - sex
      type: object
    PaginatedPatientList:
      properties:
        count:
          example: 123
          type: integer
        next:
          example: http://api.example.org/accounts/?offset=400&limit=100
          format: uri
          nullable: true
          type: string
        previous:
          example: http://api.example.org/accounts/?offset=200&limit=100
          format: uri
          nullable: true
          type: string
        results:
          items:
            $ref: '#/components/schemas/Patient'
          type: array
      required:
      - results
      type: object
    Insurance:
      properties:
        address:
          maxLength: 200
          type:
          - string
          - 'null'
        carrier:
          maxLength: 200
          type:
          - string
          - 'null'
        city:
          maxLength: 50
          type:
          - string
          - 'null'
