      x-el8-docs-category: Patient Document API
      x-el8-docs-versions:
      - '2.1'
      - '2.0'
    servers:
    - description: Sandbox Server
      url: https://sandbox.elationemr.com
    - description: Production Server
      url: https://api.app.elationemr.com
components:
  schemas:
    VitalOxygenUnitsEnum:
      enum:
      - '%'
      type: string
    VitalHeightUnitsEnum:
      enum:
      - inches
      type: string
    VitalBP:
      properties:
        diastolic:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
        systolic:
          type:
          - string
          - 'null'
      type: object
    PatchedVitalsCollection:
      properties:
        bmi:
          format: double
          type:
          - number
          - 'null'
        bmi_percentile:
          description: The BMI percentile of the patient. Optional. Will be automatically calculated from height and weight otherwise.
          readOnly: true
          type:
          - integer
          - 'null'
        bp:
          description: The blood pressure of the patient. Will allow multiple items in array.
          items:
            $ref: '#/components/schemas/VitalBP'
          type: array
        chart_date:
          format: date-time
          type: string
        created_date:
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        custom_observations:
          additionalProperties:
            properties:
              label:
                type: string
              note:
                type:
                - string
                - 'null'
              units:
                type:
                - string
                - 'null'
              value:
                type: string
            type: object
          type: object
        deleted_date:
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        document_date:
          format: date-time
          type: string
        hc:
          description: The head circumference of the patient. Will only allow array of one.
          items:
            $ref: '#/components/schemas/VitalHC'
          type: array
        height:
          description: The height of the patient. Will only allow array of one.
          items:
            $ref: '#/components/schemas/VitalHeight'
          type: array
        hr:
          description: The heart rate of the patient. Will only allow array of one.
          items:
            $ref: '#/components/schemas/VitalHR'
          type: array
        id:
          readOnly: true
          type: integer
        length_for_weight_percentile:
          description: The length for weight percentile for the patient.
          format: double
          readOnly: true
          type:
          - number
          - 'null'
        non_visit_note:
          description: The non-visit note that the vital belongs to. Will only allow unsigned non-visit notes.
          format: int64
          type:
          - integer
          - 'null'
        oxygen:
          description: The oxygen saturation of the patient. Will only allow array of one.
          items:
            $ref: '#/components/schemas/VitalOxygen'
          type: array
        pain:
          description: The pain of the patient. Will only allow array of one.
          items:
            $ref: '#/components/schemas/VitalPain'
          type: array
        patient:
          format: int64
          type: integer
        practice:
          format: int64
          type: integer
        rr:
          description: The respiratory rate of the patient. Will only allow array of one.
          items:
            $ref: '#/components/schemas/VitalRR'
          type: array
        signed_by:
          format: int64
          readOnly: true
          type: integer
        signed_date:
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        temperature:
          description: The temperature of the patient. Will only allow array of one.
          items:
            $ref: '#/components/schemas/VitalTemperature'
          type: array
        visit_note:
          description: The visit note that the vital belongs to. Will only allow unsigned visit notes.
          format: int64
          type:
          - integer
          - 'null'
        weight:
          description: The weight of the patient. Will only allow array of one.
          items:
            $ref: '#/components/schemas/VitalWeight'
          type: array
      type: object
    VitalHR:
      properties:
        note:
          type:
          - string
          - 'null'
        units:
          allOf:
          - $ref: '#/components/schemas/VitalHRUnits'
          readOnly: true
        value:
          type:
          - string
          - 'null'
      type: object
    VitalHCUnitsEnum:
      enum:
      - cm
      type: string
    VitalTemperature:
      properties:
        note:
          type:
          - string
          - 'null'
        units:
          allOf:
          - $ref: '#/components/schemas/VitalTemperatureUnitsEnum'
          readOnly: true
        value:
          type:
          - string
          - 'null'
      type: object
    VitalPain:
      properties:
        note:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      type: object
    VitalHC:
      properties:
        note:
          type:
          - string
          - 'null'
        percentile:
          readOnly: true
          type:
          - integer
          - 'null'
        units:
          allOf:
          - $ref: '#/components/schemas/VitalHCUnitsEnum'
          readOnly: true
        value:
          type:
          - string
          - 'null'
      type: object
    VitalHRUnits:
      enum:
      - bpm
      type: string
    VitalWeightUnitsEnum:
      enum:
      - lbs
      type: string
    VitalTemperatureUnitsEnum:
      enum:
      - celsius
      - fahrenheit
      type: string
    VitalRR:
      properties:
        note:
          type:
          - string
          - 'null'
        units:
          allOf:
          - $ref: '#/components/schemas/VitalHRUnits'
          readOnly: true
        value:
          type:
          - string
          - 'null'
      type: object
    PaginatedVitalsCollectionList:
      properties:
        count:
          example: 123
          type: integer
        next:
          example: http://api.example.org/accounts/?offset=400&limit=100
          format: uri
          nullable: true
