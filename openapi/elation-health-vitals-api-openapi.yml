openapi: 3.2.0
info:
  title: Elation Health Vitals API
  version: '1.0'
  description: 'Operations tagged Vitals across 3 of this provider''s published API definitions: elation-api-settings.json, elation-health-api-full-openapi.yaml, elation-patient-document-api.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sandbox.elationemr.com/api/2.0
- description: Sandbox Server
  url: https://sandbox.elationemr.com
- description: Production Server
  url: https://api.app.elationemr.com
tags:
- name: Vitals
paths:
  /vitals/{id}/:
    get:
      summary: Get Vital
      description: ''
      operationId: get-vital
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 65098023184,\n  // See Object Definition\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "import requests\nimport json\n\naccess_token = \"TyEPKw8fVGRKpCBa81ygwjCLXDNIAm\"\nauth_header = \"Bearer %s\" % (access_token)\n\nresp = requests.get(\"https://sandbox.elationemr.com/api/2.0/vitals/64184451073/\",\n                    headers={'Authorization': auth_header})\n\nprint resp.status_code\nprint json.dumps(json.loads(resp.content), indent=2)"
        samples-languages:
        - python
      tags:
      - Vitals
      security:
      - sec0: []
    servers:
    - url: https://sandbox.elationemr.com/api/2.0
  /vitals/:
    get:
      summary: Find Vitals
      description: ''
      operationId: find-vitals
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: patient
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: practice
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: visit_note
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: non_visit_note
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"count\": 123,\n  \"next\": \"https://sandbox.elationemr.com/api/2.0/vitals/?limit=10&offset=10\",\n  \"previous\": \"https://sandbox.elationemr.com/api/2.0/vitals/?limit=10\",\n  \"results\": [  // list of objects\n    { // See Object Definition },\n    // ...\n    { // See Object Definition },\n  ]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "import requests\nimport json\n\naccess_token = \"VFroUHsmrErlVI6nJ08Alwhri5RGCW\"\nauth_header = \"Bearer %s\" % (access_token)\n\nresp = requests.get(\"https://sandbox.elationemr.com/api/2.0/vitals/\",\n                    headers={'Authorization': auth_header})\n\nprint resp.status_code\nprint json.dumps(json.loads(resp.content), indent=2)"
        samples-languages:
        - python
      tags:
      - Vitals
      security:
      - sec0: []
    post:
      summary: Create Vitals
      description: ''
      operationId: create-vital
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - patient
              - practice
              properties:
                patient:
                  type: integer
                  description: Patient ID
                  format: int32
                practice:
                  type: integer
                  description: Practice ID
                  format: int32
                visit_note:
                  type: integer
                  description: Will only allow unsigned visit notes
                  format: int32
                non_visit_note:
                  type: integer
                  description: Will only allow unsigned non-visit notes
                  format: int32
                bmi:
                  type: number
                  description: Optional. Will be automatically calculated from height and weight otherwise
                  format: double
                height:
                  type: array
                  description: Will only allow array of one.
                weight:
                  type: array
                  description: Will only allow array of one.
                oxygen:
                  type: array
                  description: Will only allow array of one.
                rr:
                  type: array
                  description: Will only allow array of one.
                hr:
                  type: array
                  description: Will only allow array of one.
                hc:
                  type: array
                  description: Will only allow array of one.
                temperature:
                  type: array
                  description: Will only allow array of one.
                bp:
                  type: array
                  description: Will allow multiple items in array
                ketone:
                  type: array
                  description: Optional. See Vital Object Definition for supported observations.
                bodyfat:
                  type: array
                  description: Optional. Will only allow array of one
                dlm:
                  type: array
                  description: Optional. Will only allow array of one
                bfm:
                  type: array
                  description: Optional. Will only allow array of one
                wc:
                  type: array
                  description: Optional. Will only allow array of one
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 65098023184,\n  // See Object Definition\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "import requests\nimport json\n\naccess_token = \"TyEPKw8fVGRKpCBa81ygwjCLXDNIAm\"\nauth_header = \"Bearer %s\" % (access_token)\n\n# sending a list of vitals in single call\ndata = {\n  \"patient\": 64901939201,\n  \"practice\": 65540,\n  \"visit_note\": 79923773464,\n  \"bmi\": 21.52,\n  \"height\": [{\n    \"value\": \"70\",\n    \"note\": \"no shoes\"\n  }],\n  \"weight\": [{\n    \"value\": \"150\",\n    \"note\": \"in shorts\"\n  }],\n  \"oxygen\": [{\n    \"value\": \"98\",\n    \"note\": \"good\"\n  }],\n  \"rr\": [{\n    \"value\": \"20\",\n    \"note\": \"deep\"\n  }],\n  \"hr\": [{\n    \"value\": \"60\",\n    \"note\": \"calm\"\n  }],\n  \"hc\": [{\n    \"value\": \"30\",\n    \"note\": \"big\"\n  }],\n  \"temperature\": [{\n    \"value\": \"98\",\n    \"note\": \"t-shirt\"\n  }],\n  \"bp\": [{\n    \"systolic\": \"120\",\n    \"diastolic\": \"80\",\n    \"note\": \"sitting down\"\n  }],\n  \"ketone\": [\n    {\n      \"note\": \"\",\n      \"value\": \"1.3\"\n    }\n  ],\n  \"bodyfat\": [\n    {\n      \"note\": \"\",\n      \"value\": \"35.9\"\n    }\n  ],\n  \"dlm\": [\n    {\n      \"note\": \"\",\n      \"value\": \"26.9\"\n    }\n  ],\n  \"bfm\": [\n    {\n      \"note\": \"\",\n      \"value\": \"57.0\"\n    }\n  ],\n  \"wc\": [\n    {\n      \"note\": \"\",\n      \"value\": \"47\"\n    }\n  ]\n}\n\nresp = requests.post(\"https://sandbox.elationemr.com/api/2.0/vitals/\",\n                     data=json.dumps(data),\n                     headers={'Authorization': auth_header,\n                              'Content-type': 'application/json'})\n\nprint resp.status_code\nprint json.dumps(json.loads(resp.content), indent=2)"
        samples-languages:
        - python
      tags:
      - Vitals
      security:
      - sec0: []
    servers:
    - url: https://sandbox.elationemr.com/api/2.0
