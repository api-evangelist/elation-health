      summary: Update Team Member
      description: ''
      operationId: update-patientproviderteammember-details
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: team_member_id
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                treatment_reason:
                  type: string
      responses:
        '200':
          description: '200'
          content:
