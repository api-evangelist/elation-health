    delete:
      summary: Delete a Team Member
      description: ''
      operationId: delete-patientproviderteammember
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: team_member_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n\t\"detail\": \"Patient provider team member not found.\"\n}"
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Patient provider team member not found.
      deprecated: false
