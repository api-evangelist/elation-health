              schema:
                type: object
                properties:
                  patient_provider_team_id:
                    type: integer
                    example: 58726220062
                    default: 0
                  patient_provider_team_member_id:
                    type: integer
                    example: 140758911484191
                    default: 0
                  patient_id:
                    type: integer
                    example: 887422977
                    default: 0
                  physician_id:
                    type: integer
                    example: 983042
                    default: 0
                  group:
                    type: string
                    example: main
                  rank:
                    type: integer
                    example: 1
                    default: 0
