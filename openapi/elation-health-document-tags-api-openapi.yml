  /api/2.0/document_tags/:
    get:
      operationId: document_tags_list
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - description: Number of results to return per page.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: The initial index from which to return the results.
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: Which field to use when ordering the results.
        in: query
        name: order_by
        required: false
        schema:
          type: string
      - in: query
        name: practice_created
        schema:
          type: integer
      - in: query
        name: value
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCodedDocumentTagList'
          description: ''
      security:
      - oauth2: []
      summary: List Document Tags
      tags:
      - Document Tags
      x-el8-docs-category: Patient Document API
      x-el8-docs-versions:
      - '2.1'
      - '2.0'
    post:
      description: Create a new document tag.
      operationId: document_tags_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodedDocumentTag'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
