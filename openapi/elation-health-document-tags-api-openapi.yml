      operationId: create-document-tag
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: The value of the tag
                description:
                  type: object
                  description: The description of the tag
                  properties: {}
                code_type:
                  type: string
                  description: The type of the tag's cod. Choices = CPT, SNOMED, HL7, ICD9, LOINC, CVX, RXNORM, ICD10, CPTII, HCPCS or EL8
                code:
                  type: integer
                  description: The code of the tag
                  format: int32
                practice_created:
                  type: integer
                  description: The id of the tag's practice
                  format: int32
                concept_name:
                  type: string
                  description: The name of the tag's concept
                  format: date
                context:
                  type: string
