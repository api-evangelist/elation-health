                type: object
                properties:
                  resource:
                    type: string
                    example: patients
                  target:
                    type: string
                    example: https://requestb.in/18pqnk11
                  created_date:
                    type: string
                    example: '2017-01-01T01:05:00Z'
                  deleted_date: {}
