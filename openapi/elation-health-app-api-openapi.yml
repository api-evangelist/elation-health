        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n \"resource\": \"patients\",\n \"target\": \"https://requestb.in/18pqnk11\",\n \"created_date\": \"2017-01-01T01:05:00Z\",\n \"deleted_date\": null\n}"
