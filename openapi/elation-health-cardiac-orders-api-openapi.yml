openapi: 3.2.0
info:
  title: Elation Health Cardiac Orders API
  version: '1.0'
  description: 'Operations tagged Cardiac Orders across 3 of this provider''s published API definitions: elation-api-settings.json, elation-health-api-full-openapi.yaml, elation-orders-api.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sandbox.elationemr.com/api/2.0
- description: Sandbox Server
  url: https://sandbox.elationemr.com
- description: Production Server
  url: https://api.app.elationemr.com
tags:
- name: Cardiac Orders
paths:
  /cardiac_orders/{id}:
    get:
      summary: Get Cardiac Order
      description: ''
      operationId: get-cardiac-order
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          format: int32
        required: true
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n \"id\": 140756377075740,\n  // See Object Definition\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "import requests\nimport json\n\naccess_token = \"TyEPKw8fVGRKpCBa81ygwjCLXDNIAm\"\nauth_header = f\"Bearer {access_token}\"\n\nresp = requests.get(\n    \"https://sandbox.elationemr.com/api/2.0/cardiac_orders/140756377075740/\",\n    headers={\"Authorization\": auth_header},\n)\n\nprint resp.status_code\nprint json.dumps(json.loads(resp.content), indent=2)"
        samples-languages:
        - python
      tags:
      - Cardiac Orders
      security:
      - sec0: []
    put:
      summary: Update Cardiac Order
      description: ''
      operationId: put-cardiac-order
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - ancillary_company
              - chart_date
              - clinical_reason
              - document_date
              - patient
              - practice
              - prescribing_user
              properties:
                ancillary_company:
                  type: integer
                  description: The ancillary company the order is associated with.
                  format: int32
                cardiac_center:
                  type: integer
                  description: The cardiac center the order is associated with.
                  default: null
                  format: int32
                ccs:
                  type: array
                  description: Array of Physician IDs to copy for the order.
                  items:
                    type: integer
                    format: int32
                chart_date:
                  type: string
                  format: date
                clinical_reason:
                  type: string
                  description: The clinical reason for the order.
                confidential:
                  type: boolean
                  description: Whether the order is confidential.
                  default: false
                document_date:
                  type: string
                  format: date
                follow_up_method:
                  type: string
                  description: How to notify the patient of the results.
                icd10_codes:
                  type: array
                  description: Array of ICD-10 diagnosis codes associated with the order
                  items:
                    properties:
                      code:
                        type: string
                        description: icd10 code
                    type: object
                medications:
                  type: string
                  description: Description of beta blockers/medications the patient is taking.
                patient:
                  type: integer
                  description: The patient the order is associated with. Patient must belong to the specified practice. Not allowed to be changed for updates.
                  format: int32
                practice:
                  type: integer
                  description: The practice the order is associated with. Not allowed to be changed for updates.
                  format: int32
                prescribing_user:
                  type: integer
                  description: The user associated with the order. User ID must tie to a physician in the practice.
                  format: int32
                tests:
                  properties:
                    ? ''
                    : properties:
                        id:
                          type: integer
                          description: The ID of the cardiac order test to be associated with the order. Cardiac order test must belong to the specified practice.
                          format: int32
                      required:
                      - id
                      type: object
                  required: []
                  type: object
                  description: An array of cardiac tests associated with the order.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n \"id\": 140756377075740,\n  // See Cardiac Order Object Definition\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "import requests\nimport json\n\naccess_token = \"TyEPKw8fVGRKpCBa81ygwjCLXDNIAm\"\nauth_header = f\"Bearer {access_token}\"\n\nupdated_imaging_order_data = {\n  \t\"ancillary_company\": 140755855605768,\n    \"cardiac_center\": 140755855671306,\n    \"ccs\": [\n        131074\n    ],\n    \"chart_date\": \"2021-05-26T03:49:04Z\",\n    \"clinical_reason\": \"sickness\",\n    \"confidential\": true,\n    \"document_date\": \"2021-05-26T03:49:04Z\",\n    \"follow_up_method\": \"email\",\n    \"icd10_codes\": [\n        {\n            \"code\": \"O09.529\",\n            \"description\": \"Supervision of elderly multigravida, unspecified trimester\"\n        }\n    ],\n    \"medications\": \"b-blocker\",\n    \"patient\": 140756664516609,\n    \"practice\": 140756660256772,\n    \"prescribing_user\": 2032,\n    \"tests\": [\n        {\n            \"id\": 140756665106487\n        }\n    ]\n}\n\nresp = requests.put(\n    \"https://sandbox.elationemr.com/api/2.0/imaging_orders/140756377075740\",\n    headers={\"Authorization\": auth_header},\n  \tjson=updated_imaging_order_data,\n)\n\nprint resp.status_code\nprint json.dumps(json.loads(resp.content), indent=2)"
        samples-languages:
