name: Elation Health
kind: company
description: >-
  Elation Health is a United States clinical-first electronic health record (EHR/EMR)
  and healthcare technology company, founded in 2010 and headquartered in San Francisco,
  California, serving independent primary care practices, value-based care organizations,
  digital health startups, and health-tech partners. Beyond its provider-facing EHR,
  Elation ships a broad, well-documented public REST API (v2.0) that lets partners read
  and write clinical and administrative data - patient profiles and demographics,
  allergies and problems, visit notes, clinical and lab/imaging orders, patient documents,
  scheduling, billing, insurance and eligibility, messaging, practice and user management,
  care gaps, and data import - authenticated with OAuth2. The API is documented on a
  ReadMe developer portal backed by machine-readable OpenAPI definitions, augmented with
  event subscription webhooks and a Model Context Protocol (MCP) server for agentic access.
  Elation also operates login-gated HL7 FHIR R4 and SMART-on-FHIR interoperability
  endpoints for ONC/CMS 21st Century Cures Act information-blocking compliance, exposed to
  registered applications rather than anonymously. Positioned as an independent challenger
  to the US EHR duopoly, Elation targets the primary-care and value-based-care segment of
  the largest, most commercial healthcare-API market.
