- aid: elation-health:fhir-api
  name: Elation FHIR R4 API
  description: >-
    HL7 FHIR R4 (v4.0.1) API with US Core v5.0.1 and SMART on FHIR 1.0.0 support, used for standards-based
    interoperability and ONC / CMS 21st Century Cures Act certified health IT use cases. Exposed to registered
    applications only: an anonymous probe of /fhir/r4/metadata and /fhir/r4/.well-known/smart-configuration
    on 2026-08-14 returned HTTP 401 {"detail":"Invalid authentication token"}, so the FHIR CapabilityStatement
    and SMART discovery document are gated and no machine-readable contract could be harvested.
