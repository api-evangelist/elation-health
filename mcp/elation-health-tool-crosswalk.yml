  resource, so there is no 1:1 binding between any MCP tool and a single
  OpenAPI operationId — the crosswalk is intentionally empty and every tool is
  recorded under mcp_only. The CURRENT server (help.elationhealth.com/mcp,
  Mintlify) is a documentation server: it searches and reads the docs and their
  bundled OpenAPI specs, and cannot call the Elation API at all. The LEGACY
  server (docs.elationhealth.com/mcp, ReadMe) is a generic OpenAPI-navigation
  server whose execute-request tool can invoke ANY operation via a HAR request
  object, fanning out across the whole spec rather than binding to one
  operationId. GraphQL is not offered.
